experiment:
  mode: tune_and_test
  experiment_seed: 42
  split_seed: 42
output:
  root: results
  save_manifest: true
  save_resolved_config: true
  save_checkpoints: true
logging:
  console: true
  save_to_file: true
  level: INFO
model:
  shared_hidden_dim: 512
  adapter_bottleneck_dim: 64
  dropout: 0.1
  use_shared_trunk: true
  single_head:
    shared_hidden_dim: 1024
    dropout: 0.1
  double_head:
    shared_hidden_dim: 1024
    dropout: 0.1
training:
  base:
    learning_rate: 0.0003
    weight_decay: 0.0001
    epochs: 50
    batch_size: 64
    early_stopping:
      enabled: true
      patience: 5
      min_delta: 0.0001
  single_head:
    learning_rate: 0.0003
    weight_decay: 0.0001
    batch_size: 32
  double_head:
    learning_rate: 0.001
    weight_decay: 0.0
    batch_size: 32
    epochs: 50
    early_stopping:
      enabled: true
      patience: 5
      min_delta: 0.0001
  temporal:
    enabled: true
    learning_rate: 0.0001
    epochs: 50
    reset_optimizer_each_year: false
    early_stopping:
      enabled: true
      patience: 5
      min_delta: 0.0001
methods:
  frozen:
    enabled: true
  supervised_reference:
    enabled: true
  metadata_episodic:
    enabled: true
    learning_rate: 0.0003
    batch_size: 1
    regularization: 0.0
    gradient_clip: 0.1
    normalized_aux_loss_threshold: 0.25
    steps: 1
  metadata_cumulative:
    enabled: true
    learning_rate: 0.0001
    batch_size: 1
    regularization: 0.0
    gradient_clip: 0.1
    normalized_aux_loss_threshold: 0.5
    steps: 1
  metadata_cumulative_annual_reset:
    enabled: true
    learning_rate: 0.0001
    batch_size: 1
    regularization: 0.0
    gradient_clip: 0.1
    normalized_aux_loss_threshold: 0.5
    steps: 1
  metadata_cumulative_drift_reset:
    enabled: true
    learning_rate: 0.0001
    batch_size: 1
    regularization: 0.0
    gradient_clip: 0.1
    normalized_aux_loss_threshold: 0.5
    steps: 1
    drift_signal: normalized_aux_loss
    adwin_delta: 0.01
  metadata_cumulative_drift_annual_reset:
    enabled: true
    learning_rate: 0.0001
    batch_size: 1
    regularization: 0.0
    gradient_clip: 0.1
    normalized_aux_loss_threshold: 0.5
    steps: 1
    drift_signal: normalized_aux_loss
    adwin_delta: 0.1
  temporal_gradient_ema:
    enabled: true
    learning_rate: 0.0001
    batch_size: 1
    regularization: 0.0
    gradient_clip: 0.1
    normalized_aux_loss_threshold: 0.5
    steps: 1
    beta: 0.9
    orthogonal_scale: 0.75
    warmup_updates: 16
  tent:
    enabled: true
    learning_rate: 0.0001
    weight_decay: 0.0
    optimizer: adam
    batch_size: 128
    steps: 1
  cotta:
    enabled: false
supervised_reference:
  initialization: final_source_model
  independent_per_year: true
  use_train_split: true
  use_validation_split: true
  evaluate_on_test_split: true
checks:
  verify_split_disjointness: true
  forbid_test_split_during_tuning: true
  forbid_tuning_checkpoint_reuse_for_final_run: true
  verify_single_double_equivalence: true
  verify_trainable_parameters: true
dataset:
  name: yearbook
  data_root: /Users/lorenzoiovine/Library/CloudStorage/OneDrive-PolitecnicodiMilano/Lavoro/Lavori/Temporal
    Distribution Shift/moco_embedding/yearbook_embeddings_csv_encoded
  cache_root: .cache
  n_classes_main: 2
  n_classes_aux: 23
  target_column: target
  aux_target_column: aux_target
  split:
    test_size: 0.2
    validation_size_within_train: 0.125
protocol:
  pseudo_source:
    start_year: 1930
    end_year: 1969
  pseudo_ood:
    start_year: 1970
    end_year: 1970
  final_source:
    start_year: 1930
    end_year: 1970
  real_ood:
    start_year: 1971
    end_year: 2013
pca:
  enabled: false
metadata_cumulative_drift_annual_reset:
  adwin_delta: 0.01
  drift_signal: normalized_aux_loss
